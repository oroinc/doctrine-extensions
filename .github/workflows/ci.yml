name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0']
        db_image_name: [mysql, percona, postgres]
        include:
          - db_image_name: mysql
            db_image_version: 8
            db: mysql
            db_host_port: 33060
            db_port: 3306
            vars: '-e MYSQL_PASSWORD=travis -e MYSQL_DATABASE=doctrine_extensions_tests -e MYSQL_USER=travis -e MYSQL_ROOT_PASSWORD=travis'
            health: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10'
          - db_image_name: percona
            db_image_version: 8
            db: mysql
            db_host_port: 33060
            db_port: 3306
            vars: '-e MYSQL_PASSWORD=travis -e MYSQL_DATABASE=doctrine_extensions_tests -e MYSQL_USER=travis -e MYSQL_ROOT_PASSWORD=travis'
            health: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10'
          - db_image_name: postgres
            db_image_version: 15
            db: pgsql
            db_host_port: 54320
            db_port: 5432
            vars: '-e POSTGRES_DB=doctrine_extensions_tests -e POSTGRES_USER=travis -e POSTGRES_PASSWORD=travis'
            health: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5'

    services:
      database:
        image: ${{ matrix.db_image_name }}:${{ matrix.db_image_version }}
        ports:
          - ${{ matrix.db_host_port }}:${{ matrix.db_port }}
        options: >-
          ${{ matrix.vars }}
          ${{ matrix.health }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_pgsql
          coverage: none

      # This branch serves OroPlatform 4.2, which is fixed to doctrine/orm 2.8.1 with doctrine/dbal 2.12
      # and doctrine/lexer 1, so the dependencies are pinned to that combination instead of the latest one.
      - name: Install dependencies
        run: |
          composer self-update
          composer update --prefer-dist --optimize-autoloader --no-interaction \
            --with doctrine/orm:2.8.1 \
            --with doctrine/dbal:2.12.* \
            --with doctrine/lexer:^1.0

      - name: Show the resolved dependencies
        run: composer show doctrine/orm doctrine/dbal doctrine/lexer

      - name: Run setup tests
        run: vendor/bin/phpunit --configuration tests/config/${{ matrix.db }}.phpunit.xml tests/Oro/Tests/Connection/SetupTest.php

      - name: Run test suite
        run: vendor/bin/phpunit --configuration tests/config/${{ matrix.db }}.phpunit.xml --testsuite="Oro Doctrine Extensions Test Suite"

      - name: Check code style
        run: vendor/bin/phpcs src/ tests/ -p --encoding=utf-8 --extensions=php --standard=psr2

      - name: Tear down tests
        run: vendor/bin/phpunit --configuration tests/config/${{ matrix.db }}.phpunit.xml tests/Oro/Tests/Connection/TearDownTest.php
